- name: Copy docker-compose file to remote server
  copy:
    src: ansible-java_mysql_phpmyadmin.yaml
    dest: /home/ausman/docker-compose.yaml

- name: Docker login
  docker_login:
    registry_url: "{{docker_registry}}"
    username: "{{docker_username}}"
    password: "{{docker_password}}"
        
- name: Start containers with docker compose
  community.docker.docker_compose_v2:  # need full module name as there are two docker compose modules
    project_src: /home/ausman
    state: present # docker compose up